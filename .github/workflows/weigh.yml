name: weigh
on:
  workflow_dispatch: {}
permissions: {contents: read}
concurrency: {group: pictures, cancel-in-progress: false}
jobs:
  weigh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Ayo-Billionaire/billio-data, ssh-key: "${{ secrets.DATA_KEY }}", path: data, fetch-depth: 1}
      - run: python3 cloud/weigh.py data
      - run: cd data && git config user.name billio-bot && git config user.email billio-bot@users.noreply.github.com && git add pool && (git diff --cached --quiet || git commit -q -m "picture sizes") && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
